services:
  postgres:
    image: postgres:16-alpine
    container_name: turkcell-db
    environment:
      POSTGRES_DB: TurkcellDecisionEngine
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: turkcell-backend
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=TurkcellDecisionEngine;Username=postgres;Password=postgres
      - Jwt__Secret=TurkcellDecisionEngineSecretKey2024VeryLongSecretKey!
      - Jwt__Issuer=TurkcellDecisionEngine
      - Jwt__Audience=TurkcellDecisionEngine
    ports:
      - "5050:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:5050/api
    container_name: turkcell-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
